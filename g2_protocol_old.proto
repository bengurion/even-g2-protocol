// Even Realities G2 Protocol Buffers
// Reverse engineered from BLE traffic analysis + SDK type definitions
//
// NOTE: Field numbers and types are inferred from captured packets
// and the Even Hub SDK (TypeScript type stubs with PB field comments).
//
// SERVICE ID CONVENTION (discovered via session_probe 2026-02-26):
//   0xXX-20 = Data command (phone → glasses)
//   0xXX-00 = Control/ack response (glasses → phone)
//   0xXX-01 = Data response (glasses → phone)
//
// SDK SOURCE: @evenrealities/even_hub_sdk/dist/index.d.ts (1210 lines)
// All "对应 PB:" comments in the SDK reference actual protobuf field names.
//
// G1 CORRELATION (2026-02-27):
//   Cross-referenced with EvenDemoApp (G1 Flutter demo, github.com/even-realities/EvenDemoApp).
//   G1 uses Nordic UART (6E400001) + simple cmd-byte protocol (no protobuf).
//   G2 migrated to custom UUID (00002760-08c2-11e1-...) + protobuf payloads.
//   Functional mapping:
//     G1 cmd 0x0E (mic on)      → G2 AudioControl / unknown BLE service
//     G1 cmd 0x4E (AI text)     → G2 Teleprompter 0x06-20 + EvenHub containers
//     G1 cmd 0x25 (heartbeat)   → G2 SyncMessage 0x80-00 (type=0x0E) ✅ CONFIRMED
//     G1 cmd 0xF5 (events)      → G2 EventStream 0x01-01 ⚠️ REQUIRES SDK SESSION
//     G1 cmd 0x18 (exit)        → G2 ShutDownContaniner
//     G1 cmd 0xF1 (LC3 audio)   → G2 AudioEventPayload (decoded to PCM by Flutter)
//     G1 cmd 0x4B (notify JSON) → G2 NotificationMessage 0x02-20
//     G1 cmd 0x15/0x20/0x16 (BMP) → G2 ImageRawDataUpdateFields
//     G1 cmd 0x34 (serial num)  → G2 DeviceInfoRequest 0x09-00
//     G1 cmd 0x04 (app whitelist) → G2 unknown (may be deprecated)
//
// HARDWARE VALIDATION (2026-02-27, test_g1_findings.py):
//   ✅ Heartbeat: SyncMessage(type=0x0E) on 0x80-00 — glasses echo back, 8s interval
//   ✅ Transport: dir byte confirmed (0x21=out, 0x12=in), NOT type field
//   ❌ Event stream: NOT triggered by raw BLE service commands alone
//   ❌ Mic enable: All 6 raw BLE approaches failed (no audio data received)
//   ❌ Service preamble: DeviceInfo/Config/Dashboard/DisplayWake/Tasks/
//      DisplayTrigger commands do NOT activate event stream
//   ⚠️ Event stream requires EvenHub SDK container lifecycle (Flutter host)
//   ⚠️ Raw service commands can put glasses in confused state (needs power cycle)
//
// DUAL-BLE + R1 RING ARCHITECTURE (2026-02-27, HCI stream capture):
//   ✅ CONFIRMED: G2 system is THREE BLE peripherals:
//     - Left arm  (glasses)
//     - Right arm (glasses)
//     - R1 Ring   (input controller)
//   The Even Hub app (com.even.sg) connects to all three simultaneously:
//     Device 1: A590B18A-C0B2-... → Left/Right arm, connects first (t=27s), 4 char subscribes
//     Device 2: 45E760C1-9F05-... → Left/Right arm, connects second (t=33s), 4 char subscribes
//     Device 3: 884A62D5-E0EB-... → R1 RING, connects third (t=44s), 1 char subscribe
//   Each glasses arm exposes identical GATT services (4 services, 8 characteristics).
//   The R1 ring only needs 1 characteristic — it sends control events to the glasses.
//
//   R1 RING ROLE:
//     The R1 ring is the PRIMARY INPUT DEVICE for the G2 glasses.
//     It sends: tap, double tap, long press, scroll up/down events.
//     These events are what drive teleprompter scrolling, menu navigation,
//     and likely the "Start Even AI" trigger (long press → mic activation).
//     The ring communicates with the glasses (possibly directly, or via phone relay).
//     Events from the ring appear on service 0x01-01 (EventStream).
//
//   ARM TOUCH SENSORS:
//     Both glasses arms have capacitive touch sensors (TouchBar).
//     Touching BOTH arms simultaneously activates QUIET MODE in Even Hub.
//     Individual arm touches produce tap/swipe events; simultaneous dual-arm
//     touch is a distinct gesture with its own event category.
//
//   G1 EvenDemoApp confirms: "each arm corresponds to a separate BLE connection"
//     - Default: send commands to BOTH sides
//     - Mic activation (0x0E 0x01): right side only (mic is on right arm)
//     - BMP images: sent to both in parallel
//   Device names follow pattern: Even G2_XX_{L|R}_YYYYYY
//   Our python/bleak scripts only connected to 1-2 devices — missing the ring
//   may explain why events/gestures weren't captured in some tests.

syntax = "proto3";

package even.g2;

// =============================================================================
// Transport Layer (NOT protobuf — raw binary framing)
// =============================================================================
//
// BLE GATT TABLE (from HCI statedump, 2026-02-27):
//
// Service 0x1001  handle=0x0820  end=0x0825  "System/Init"
//   Char 0x0001   decl=0x0821 val=0x0822     System write
//   Char 0x0002   decl=0x0823 val=0x0824     System notify
//
// Service 0x5450  handle=0x0840  end=0x0845  "Protocol" (main command channel)
//   Char 0x5401   decl=0x0841 val=0x0842     Write (phone→glasses, all commands)
//   Char 0x5402   decl=0x0843 val=0x0844     Notify (glasses→phone, all responses)
//
// Service 0x6450  handle=0x0860  end=0x0865  "Display"
//   Char 0x6401   decl=0x0861 val=0x0862     Display write (204-byte render packets)
//   Char 0x6402   decl=0x0863 val=0x0864     Display notify
//   ★ DUAL-PURPOSE: 0x6402 also carries mic audio (205B packets, no 0xAA framing)
//     When mic is active, audio streams on 0x6402 LEFT arm at 20 Hz, 205 bytes/pkt
//     Distinguish from display data: audio=exactly 205 bytes, no 0xAA prefix
//
// Service 0x7450  handle=0x0880  end=0x0885  "Audio"
//   Char 0x7401   decl=0x0881 val=0x0882     Audio write (commands)
//   Char 0x7402   decl=0x0883 val=0x0884     Audio notify
//   ★ NOT USED for G2 mic streaming — audio goes on 0x6402 display channel instead
//
// MTU: 527 bytes (ATT central, rx=251, tx=251, ce=7500us)
// Connection: LE, lmHandle increments per device (0x42, 0x43, 0x44)
//
// Even Hub subscription pattern (4 notify characteristics per arm):
//   Subscribe 0x5402 → protocol responses
//   Subscribe 0x0002 → system notifications
//   Subscribe 0x6402 → display feedback + ★ MIC AUDIO (205B packets when active)
//   Subscribe 0x7402 → audio stream (UNUSED — audio actually on 0x6402)
// Our scripts only subscribed to 0x5402 — missing 3 channels!
//
// PACKET FRAMING (on 0x5401 write / 0x5402 notify):
//
// Offset  Bytes  Field     Description
// ──────  ─────  ────────  ──────────────────────────────────────────────────
//  0       1     magic     Always 0xAA
//  1       1     dir       Direction: 0x21 = phone→glasses, 0x12 = glasses→phone
//  2       1     seq       Sequence number (increments per packet, wraps 0xFF)
//  3       1     len       Bytes remaining after header = len(payload) + 2 (CRC)
//  4       1     pkt_tot   Total packets in multi-packet message (always 1 observed)
//  5       1     pkt_ser   Packet serial within message (always 1 observed)
//  6       1     svc_hi    Service ID high byte
//  7       1     svc_lo    Service ID low byte (0x20=data cmd, 0x00=ctl/ack, 0x01=data resp)
//  8..N-2  var   payload   Protobuf-encoded payload
//  N-1..N  2     crc16     CRC-16/CCITT (init 0xFFFF) over payload only, little-endian
//
// Total packet size = 8 (header) + payload_len + 2 (CRC) = 10 + payload_len
// Verified: len field = payload_len + 2, NOT total packet size

