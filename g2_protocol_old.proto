// =============================================================================
// EvenHub Container Properties (SDK PB-aligned models)
// =============================================================================

// Source: SDK ListItemContainerProperty — "对齐 PB：List_ItemContainerProperty"
message ListItemContainerProperty {
  uint32 Item_Count = 1;
  uint32 Item_Width = 2;
  uint32 Is_Item_Select_Border_En = 3;  // 0 or 1
  repeated string Item_Name = 4;
}

// Source: SDK ListContainerProperty — "对齐 PB：ListContainerProperty"
message ListContainerProperty {
  uint32 X_Position = 1;
  uint32 Y_Position = 2;
  uint32 Width = 3;
  uint32 Height = 4;
  uint32 Border_Width = 5;
  uint32 Border_Color = 6;
  uint32 Border_Rdaius = 7;              // NOTE: PB spelling is "Rdaius" (typo in firmware)
  uint32 Padding_Length = 8;
  uint32 Container_ID = 9;
  string Container_Name = 10;
  ListItemContainerProperty Item_Container = 11;
  uint32 Is_event_capture = 12;          // 0 or 1
}

// Source: SDK TextContainerProperty — "对齐 PB：TextContainerProperty"
message TextContainerProperty {
  uint32 X_Position = 1;
  uint32 Y_Position = 2;
  uint32 Width = 3;
  uint32 Height = 4;
  uint32 Border_Width = 5;
  uint32 Border_Color = 6;
  uint32 Border_Rdaius = 7;
  uint32 Padding_Length = 8;
  uint32 Container_ID = 9;
  string Container_Name = 10;
  uint32 Is_event_capture = 11;
  string Content = 12;
}

// Source: SDK ImageContainerProperty — "对齐 PB：ImageContainerProperty"
message ImageContainerProperty {
  uint32 X_Position = 1;
  uint32 Y_Position = 2;
  uint32 Width = 3;
  uint32 Height = 4;
  uint32 Container_ID = 5;
  string Container_Name = 6;
}

// =============================================================================
// EvenHub Page Management (SDK PB-aligned)
// =============================================================================

// Source: SDK CreateStartUpPageContainer — "对应 PB：CreateStartUpPageContainer"
// Sent via bridge.createStartUpPageContainer()
// Defines the initial UI layout on the glasses display
message CreateStartUpPageContainer {
  uint32 ContainerTotalNum = 1;
  repeated ListContainerProperty List_Object = 2;
  repeated TextContainerProperty Text_Object = 3;
  repeated ImageContainerProperty Image_Object = 4;
}

// Source: SDK RebuildPageContainer — same structure as CreateStartUpPageContainer
// Sent via bridge.rebuildPageContainer()
// Replaces the entire UI layout
message RebuildPageContainer {
  uint32 ContainerTotalNum = 1;
  repeated ListContainerProperty List_Object = 2;
  repeated TextContainerProperty Text_Object = 3;
  repeated ImageContainerProperty Image_Object = 4;
}

// Source: SDK TextContainerUpgrade — "对应宿主 PB：TextContainerUpgrade"
// Sent via bridge.textContainerUpgrade()
// Partial text update (offset-based)
message TextContainerUpgrade {
  uint32 Container_ID = 1;
  string Container_Name = 2;
  uint32 ContentOffset = 3;
  uint32 ContentLength = 4;
  string Content = 5;
}

// Source: SDK ImageRawDataUpdateFields — "对齐 PB：ImageRawDataUpdate"
// Sent via bridge.updateImageRawData() — fragmented image uploads
message ImageRawDataUpdateFields {
  uint32 Container_ID = 1;
  string Container_Name = 2;
  uint32 mapSessionId = 3;
  uint32 mapTotalSize = 4;
  uint32 compressMode = 5;                // Compression codec ID
  uint32 mapFragmentIndex = 6;
  uint32 mapFragmentPacketSize = 7;
  bytes mapRawData = 8;                   // Image fragment bytes
}

// Source: SDK ImageRawDataUpdate (simplified "EvenHubImageContainer")
// Higher-level wrapper: containerID + containerName + full imageData
message ImageRawDataUpdate {
  uint32 Container_ID = 1;
  string Container_Name = 2;
  bytes imageData = 3;
}

// Source: SDK ShutDownContaniner — "对应宿主 PB：ShutDownContaniner"
// Note: "Contaniner" is the PB spelling (typo in firmware)
// Sent via bridge.shutDownPageContainer()
// G1 CORRELATION: Equivalent to cmd 0x18 [0x18] → exit to dashboard
message ShutDownContaniner {
  uint32 exitMode = 1;   // 0 = exit immediately, 1 = prompt user first
}

// =============================================================================
// EvenHub Events (Glasses → Flutter → WebView)
