  SCROLL_TOP_EVENT = 1;
  SCROLL_BOTTOM_EVENT = 2;
  DOUBLE_CLICK_EVENT = 3;
  FOREGROUND_ENTER_EVENT = 4;
  FOREGROUND_EXIT_EVENT = 5;
  ABNORMAL_EXIT_EVENT = 6;
}

